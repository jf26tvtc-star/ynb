<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خريطة ينبع التفاعلية — رُوح ينبع</title>
  <meta name="description" content="خريطة تفاعلية لمعالم ينبع البحر وينبع النخل وينبع الصناعية بإحداثيات موثقة من OpenStreetMap، مع تصفية حسب النوع والمفضلة والاتجاهات والمواقع القريبة.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:title" content="خريطة ينبع التفاعلية">
  <meta property="og:description" content="معالم ينبع على الخريطة مع الاتجاهات والمواقع القريبة.">
  <meta name="theme-color" content="#0b2a3c">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages/map.js" defer></script>
</head>
<body data-theme="home">
  <header id="site-header"></header>
  <main id="main" tabindex="-1" class="map-page">
    <aside class="map-side" aria-label="أدوات الخريطة">
      <div>
        <h1>خريطة ينبع</h1>
        <p class="muted" style="margin:6px 0 0;font-size:.95rem">علامات للمواقع ذات الإحداثيات المؤكدة من OpenStreetMap فقط. لا نضع علامات تقديرية.</p>
      </div>
      <fieldset style="border:0;padding:0;margin:0">
        <legend style="font-weight:700;margin-bottom:8px">المنطقة</legend>
        <div class="chips" id="zone-btns"></div>
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0">
        <legend style="font-weight:700;margin-bottom:8px">نوع المكان</legend>
        <div class="chips" id="type-filters"></div>
      </fieldset>
      <label class="chip" style="align-self:flex-start"><input type="checkbox" id="fav-only"><span>المفضلة فقط (<span data-fav-count>0</span>)</span></label>
      <div id="near-panel" aria-live="polite"></div>
      <div>
        <h2 style="font-size:1rem;margin-bottom:8px" id="list-title">المواقع على الخريطة</h2>
        <ul class="map-list" id="map-list" aria-labelledby="list-title"></ul>
      </div>
      <div class="map-unverified" id="unverified"></div>
    </aside>
    <div id="map" role="region" aria-label="الخريطة التفاعلية"><div class="map-loading" role="status">جارٍ تحميل الخريطة…</div></div>
  </main>
</body>
</html>
